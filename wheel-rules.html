<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rule Spin Wheel | TheRulesGuide.com</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="center wheelbg">
<main class="panel big">
<h1>COLREGS Rule Spin Wheel</h1>
<p class="sub">Spin for a random rule from Rule 1 to Rule 19.</p>
<section class="layout">
<div class="wheel-wrap">
<div class="pointer" aria-hidden="true"></div>
<canvas id="wheel" width="520" height="520" aria-label="Rule spin wheel"></canvas>
<div class="row">
<button id="spin" class="btn go" type="button">Spin Wheel</button>
<button id="shuffle" class="btn amber" type="button">Shuffle Wheel</button>
<a class="btn" href="index.html">Back to home</a>
</div>
</div>
<aside class="result-box" id="box" aria-live="polite">
<h2 id="winner"></h2>
<p class="sub left">Sporcle links for this rule:</p>
<div class="links" id="links"></div>
</aside>
</section>
</main>
<script src="rules.js"></script>
<script>
const nums=[...Array(19)].map((_,i)=>i+1),
 colors=['#ef4444','#f97316','#f59e0b','#eab308','#84cc16','#22c55e','#10b981','#14b8a6','#06b6d4','#0ea5e9','#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef','#ec4899','#f43f5e','#334155','#64748b'],
 cv=document.getElementById('wheel'),ctx=cv.getContext('2d'),
 spinBtn=document.getElementById('spin'),box=document.getElementById('box'),
 arc=Math.PI*2/nums.length;
let order=[],rot=0;
function shuffle(){
  order=[...nums];
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  draw();
}
function draw(){
  const r=cv.width/2;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();ctx.translate(r,r);ctx.rotate(rot);
  order.forEach((n,i)=>{
    const a=i*arc;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r-8,a,a+arc);ctx.closePath();
    ctx.fillStyle=colors[i];ctx.fill();
    ctx.save();ctx.rotate(a+arc/2);ctx.textAlign='right';ctx.fillStyle='#f8fafc';
    ctx.font='700 21px Inter,system-ui,sans-serif';ctx.fillText('Rule '+n,r-26,6);ctx.restore();
  });
  ctx.beginPath();ctx.arc(0,0,44,0,Math.PI*2);ctx.fillStyle='#0f172a';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=3;ctx.stroke();
  ctx.restore();
}
function show(n){
  document.getElementById('winner').textContent='Selected: Rule '+n;
  const el=document.getElementById('links');el.textContent='';
  RULES.filter(r=>r.n===n).forEach(r=>{
    const a=document.createElement('a');
    a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=r.label;
    el.appendChild(a);
  });
  box.classList.add('show');
}
spinBtn.onclick=()=>{
  spinBtn.disabled=true;box.classList.remove('show');shuffle();
  const w=Math.floor(Math.random()*nums.length),
   from=rot,
   to=(5+Math.floor(Math.random()*4))*Math.PI*2+Math.PI*1.5-(w+.5)*arc,
   t0=performance.now(),dur=4300;
  (function frame(now){
    const p=Math.min((now-t0)/dur,1);
    rot=from+(to-from)*(1-Math.pow(1-p,4));
    draw();
    if(p<1)requestAnimationFrame(frame);
    else{rot%=Math.PI*2;draw();spinBtn.disabled=false;show(order[w]);}
  })(t0);
};
document.getElementById('shuffle').onclick=()=>{box.classList.remove('show');shuffle();};
shuffle();
</script>
</body>
</html>
