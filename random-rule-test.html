<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random Rule Test | TheRulesGuide.com</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="center">
<main class="panel">
<h1>Random Rule Button Test</h1>
<p>Pick a random COLREGS rule quiz and open it in a new tab.</p>
<div class="row"><button id="go" class="btn" type="button">Open Random Rule</button><a class="btn" href="index.html">← Back to rules list</a></div>
<p class="result" id="out" aria-live="polite"></p>
</main>
<script src="rules.js"></script>
<script>
document.getElementById('go').onclick=()=>{
  const r=RULES[Math.floor(Math.random()*RULES.length)];
  document.getElementById('out').textContent='Opening: '+r.label;
  window.open(r.url,'_blank','noopener,noreferrer');
};
</script>
</body>
</html>
